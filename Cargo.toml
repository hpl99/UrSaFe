[workspace]
members = [
    "packages/ursafe-core-rs",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
authors = ["UrSafe Core Team <core@ursafe.network>"]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
ed25519-dalek = { version = "2.1", default-features = false }
x25519-dalek = { version = "2.0", default-features = false }
chacha20poly1305 = "0.10"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
