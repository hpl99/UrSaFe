[package]
name = "ursafe-core-rs"
version = "1.0.0"
edition = "2021"
authors = ["UrSafe Core Team <core@ursafe.network>"]
description = "High-performance memory-safe core for UrSafe emergency protocol, crypto, and CRDT"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize"] }
rand = "0.8"

[lib]
name = "ursafe_core"
crate-type = ["rlib", "cdylib"]
