[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ursafe"
version = "1.0.0"
description = "UrSafe / Cascade26 - Real Offline-First Emergency Communication & Coordination Platform"
readme = "README.md"
authors = [{ name = "UrSafe Core Team", email = "core@ursafe.network" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*", "hardware*"]
