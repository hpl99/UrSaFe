name: UrSafe CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-test-suite:
    name: Python Test Suite & Calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pytest pytest-cov

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --cov=packages --cov=services --cov=hardware

      - name: Run Acceptance Demo Script
        run: |
          python scripts/run_acceptance_demo.py

  rust-core-check:
    name: Rust Protocol, Crypto & CRDT Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check and Test
        run: |
          cargo check --verbose
          cargo test --verbose

  web-console-check:
    name: Web Console & Coordination API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test Web Console Server
        run: |
          node -e "
            const server = require('./apps/web-console/server');
            setTimeout(() => {
              console.log('Server verification passed');
              process.exit(0);
            }, 1000);
          "

  adr-and-schema-validation:
    name: ADR & Schema Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ADR Index Integrity
        run: |
          python -c "
          import os
          adrs = [f for f in os.listdir('docs/adr/decisions') if f.endswith('.md')]
          print(f'Discovered {len(adrs)} ADRs.')
          assert len(adrs) >= 17, 'All 17 required ADRs must be present.'
          print('ADR verification passed.')
          "
